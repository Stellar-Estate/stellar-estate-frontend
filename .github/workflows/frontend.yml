name: Frontend Production Build & Quality CI

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'src/**'
      - 'package.json'
      - 'vite.config.ts'
      - '.github/workflows/frontend.yml'
  pull_request:
    branches: [ "main", "master" ]

jobs:
  frontend-matrix:
    name: Node ${{ matrix.node-version }} - Frontend Quality Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Type Check
        run: npm run lint

      - name: Execute Vitest Suite
        run: npm test

      - name: Production Vite Build
        run: npm run build
